# Fase 2 - Entrega Contínua
# Dispara quando o CI termina com sucesso na branch main:
#   1. build da imagem Docker, smoke test e varredura de vulnerabilidades
#   2. publicação da imagem no GitHub Container Registry (GHCR)
#   3. deploy em staging num cluster Kubernetes (kind) + smoke test
#   4. deploy em produção na EC2 criada pelo Terraform (com aprovação manual)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build:
    name: Build, teste e publicação da imagem
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Definir nome e tag da imagem
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/taskflow-api"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build local da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Smoke test do container
        run: |
          docker run -d --name smoke -p 8080:3000 "${{ steps.meta.outputs.image }}"
          ./scripts/smoke-test.sh http://localhost:8080
          docker logs smoke
          docker rm -f smoke

      - name: Varredura de vulnerabilidades da imagem (Grype)
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.meta.outputs.image }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem (tag do commit + latest)
        run: |
          docker tag "${{ steps.meta.outputs.image }}" "${{ steps.meta.outputs.repo }}:latest"
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.repo }}:latest"
          echo "### Imagem publicada: \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy em staging (Kubernetes)
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Criar cluster Kubernetes local (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: staging

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Carregar imagem publicada no cluster
        run: |
          docker pull "${{ needs.build.outputs.image }}"
          kind load docker-image "${{ needs.build.outputs.image }}" --name staging

      - name: Deploy (rolling update com rollback automático)
        run: ./scripts/deploy-k8s.sh "${{ needs.build.outputs.image }}"

      - name: Smoke test em staging
        run: |
          kubectl -n taskflow port-forward svc/taskflow-api 8080:80 &
          sleep 3
          ./scripts/smoke-test.sh http://localhost:8080

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl -n taskflow describe deployment taskflow-api || true
          kubectl -n taskflow logs -l app=taskflow-api --tail=100 || true

  deploy-production:
    name: Deploy em produção (EC2)
    needs: [build, deploy-staging]
    # Só roda depois de configurar a variável EC2_HOST e os segredos no repositório.
    if: vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copiar arquivos de deploy para o servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,scripts/deploy.sh,monitoring
          target: /home/ec2-user/taskflow

      - name: Deploy com Docker Compose (rollback automático)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/taskflow
            chmod +x scripts/deploy.sh
            APP_PORT=80 ./scripts/deploy.sh "${{ needs.build.outputs.image }}"

      - name: Smoke test em produção
        run: ./scripts/smoke-test.sh "http://${{ vars.EC2_HOST }}"
