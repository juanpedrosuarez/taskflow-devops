<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #19266b; }
    h1 { margin-bottom: 4px; }
    form { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 8px; border: 1px solid #c5c8e8; border-radius: 6px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #393683; color: #fff; cursor: pointer; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eeeefc; }
    li.done span { text-decoration: line-through; opacity: .6; }
    li button { margin-left: auto; background: #b3261e; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>
  <h1>TaskFlow</h1>
  <small id="version"></small>
  <form id="form">
    <input id="title" placeholder="Nova tarefa" maxlength="200" required>
    <button>Adicionar</button>
  </form>
  <ul id="list"></ul>
  <script>
    const list = document.getElementById('list');
    async function api(path, opts = {}) {
      const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      return res.status === 204 ? null : res.json();
    }
    async function render() {
      const tasks = await api('/api/tasks');
      list.innerHTML = '';
      for (const t of tasks) {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
        cb.onchange = () => api('/api/tasks/' + t.id, { method: 'PUT', body: JSON.stringify({ done: cb.checked }) }).then(render);
        const span = Object.assign(document.createElement('span'), { textContent: t.title });
        const del = Object.assign(document.createElement('button'), { textContent: 'Excluir' });
        del.onclick = () => api('/api/tasks/' + t.id, { method: 'DELETE' }).then(render);
        li.append(cb, span, del);
        list.append(li);
      }
    }
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: input.value }) });
      input.value = '';
      render();
    };
    api('/health').then((h) => { document.getElementById('version').textContent = 'versão ' + h.version; });
    render();
  </script>
</body>
</html>
